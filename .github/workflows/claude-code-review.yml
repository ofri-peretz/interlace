name: Claude Code Review

# AI code review on pull requests, powered by anthropics/claude-code-action.
#
# Activation: the job no-ops (green) until the CLAUDE_CODE_OAUTH_TOKEN secret
# exists, so this file is safe to merge before the secret + Claude GitHub App
# are wired. To enable:
#   1. Install the Claude GitHub App: https://github.com/apps/claude
#   2. Generate a token locally: `claude setup-token`
#   3. Add it as the repo secret CLAUDE_CODE_OAUTH_TOKEN
#
# Billing: draws on the owner's Claude subscription monthly programmatic credit.
# With "extra usage" disabled (the default, Settings -> Usage), runs simply stop
# when the monthly credit is exhausted -- no overage is ever charged.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  # One review per PR; cancel an in-flight review when a newer commit lands.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Skip draft PRs -- review once a PR is opened or marked ready for review.
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check for Claude token
        id: token
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::CLAUDE_CODE_OAUTH_TOKEN is not set. Add the secret and install the Claude GitHub App to enable automated reviews."
          fi

      - name: Checkout repository
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          # triggerlist diffs base...HEAD, so the merge base has to be here.
          fetch-depth: 0

      # `triggerlist brief` reads the rules from the base branch and fails when it has none, as on
      # the pull request that adds them: that one run skips the review instead of going red.
      - name: Does the base branch have the review rules?
        id: rules
        if: steps.token.outputs.present == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if git cat-file -e "origin/$BASE_REF:.sdlc/checklist.yaml" && git cat-file -e "origin/$BASE_REF:REVIEW.md"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Claude review skipped::$BASE_REF has no .sdlc/checklist.yaml or REVIEW.md yet."
          fi

      # triggerlist needs Node 22.13+.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        if: steps.rules.outputs.present == 'true'
        with:
          node-version-file: .nvmrc

      # triggerlist (burgee): the reviewer reads REVIEW.md and .sdlc/checklist.yaml from the base
      # branch, the checklist items this diff fires, its own findings from the previous round and
      # the replies to them; it tags each finding Important, Nit or Pre-existing, and a review of a
      # head that moved while it ran fails instead of going green.
      - name: Claude Code Review
        if: steps.rules.outputs.present == 'true'
        uses: ofri-peretz/burgee/.github/actions/triggerlist-review@5aa232997a1dc85c888c6783b3e531d8ac92b798 # burgee main after #1861
        with:
          claude-code-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          triggerlist: npx --yes triggerlist@1
          claude-args: |
            --model claude-sonnet-4-6
            --max-turns 50
          preamble: |
            Review this pull request. First read the repository's CLAUDE.md /
            AGENTS.md and honour its conventions and contracts. REVIEW.md, in
            the brief below, holds the review rules this diff fires.

            Prioritise, in order:

            1. Correctness & security -- real bugs, broken edge cases,
               regressions, and security issues (injection, unsafe input
               handling, secret leakage, ReDoS, auth/access mistakes). Map
               security findings to a CWE when you can.
            2. Tests & regressions -- if a change fixes a bug or adds behaviour
               without a test that would fail on the old code, flag it.
            3. Public-API & docs drift -- exported or interface changes that
               don't update the matching docs, types, or README, and CLAUDE.md
               statements made stale by the change.
            4. Consumer impact -- whatever this registry ships runs in someone
               else's app: a component change that needs a consumer class, breaks
               brand neutrality, or regresses a lock in packages/ui/__tests__.

            Be precise and low-noise: cap nits -- prefer a single summary line
            over many inline style comments. If you find no blocking issues,
            say so plainly.
