# The shared gates from burgee's reusable workflows: the git hooks match the hookset presets this
# repo pins, and a PR that changes the CLI package ships a changeset (`skip-changeset` opts out).
# packages/ui keeps its own, stricter gate in ci.yml (scripts/require-changeset.mjs).
name: Shared gates

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hookset:
    uses: ofri-peretz/burgee/.github/workflows/hookset-check.yml@hookset@0.2.1
  changeset:
    uses: ofri-peretz/burgee/.github/workflows/changeset-gate.yml@hookset@0.2.1
    with:
      paths: '^packages/cli/(src|package\.json)'
