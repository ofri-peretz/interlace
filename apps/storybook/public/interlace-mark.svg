<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100">
  <!-- Canonical Interlace lockup: two-bar mark + lowercase mono wordmark.
       Manager chrome is always dark, so this uses the dark-pair bar fills
       (#f4794a / #0d9460) and the manager foreground (#ededf2) - NOT the
       theme-aware var() tokens, which don't exist in the manager's DOM. -->
  <g transform="rotate(-30 50 50)">
    <rect x="10" y="18" width="62" height="28" rx="14" fill="#f4794a"/>
    <rect x="28" y="54" width="62" height="28" rx="14" fill="#0d9460"/>
  </g>
  <text x="112" y="68" font-family="'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="54" font-weight="600" letter-spacing="-1" fill="#ededf2">interlace</text>
</svg>
