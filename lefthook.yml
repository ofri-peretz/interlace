# Git hooks. The stations come from the hookset presets (burgee packages/hookset), pinned by tag:
# bump `ref` to take a new preset version. `hookset check` (CI, hooks.yml) fails on a missing
# station, an unpinned ref, or a step here that repeats one a preset runs.
#
#   commit-msg  commitlint
#   pre-commit  npm run hook:staged -- <staged files>   oxlint on the staged files only
#   pre-push    npm run hook:verify                     turbo typecheck, test and build
#               npm run lint:guidance                   agent guidance lint (local step below)
#               npm run hook:test-integrity             truepass diff --base origin/main: weakened
#                                                       assertions, unexplained snapshots
#
# `npm run ci:local` runs the pre-push battery over every file, as CI does.
remotes:
  - git_url: https://github.com/ofri-peretz/burgee
    ref: hookset@1.1.0
    configs:
      - packages/hookset/presets/lefthook/commit-msg.yml
      - packages/hookset/presets/lefthook/pre-commit.yml
      - packages/hookset/presets/lefthook/pre-push.yml

pre-push:
  commands:
    guidance:
      run: npm run lint:guidance
    intents:
      run: npm run intent:check

# A merge resolves registry output with the `interlace-generated` driver (see .gitattributes), so
# rebuild it from the merged sources before the merge is pushed.
post-merge:
  commands:
    registry:
      run: npm run prebuild --workspace=registry
